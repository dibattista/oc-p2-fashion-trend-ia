[project]
name = "fashion-ia"
version = "0.1.0"
description = "système d'analyse automatique des tendances vestimentaires"
authors = [
    {name = "Barbara Di Battista"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "pandas (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false